<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لاروشيه كافيه — القائمة</title>
<meta name="description" content="قائمة لاروشيه كافيه، مرسين — عصائر طبيعية، سلطات فواكه، وافل، كريب، ميلك شيك وقهوة.">
<link rel="preconnect" href="https://owlmenu.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1C6A47; --green-soft:#EAF2ED;
  --dark:#0C0F0D; --page:#FFFFFF; --card:#FFFFFF;
  --text:#141816; --muted:#6B7370; --rule:#E2E7E4;
  --shadow:0 2px 10px rgba(12,15,13,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#52C08C; --green-soft:#16211B; --dark:#070908; --page:#0B0D0C; --card:#141816;
    --text:#ECF1EE; --muted:#98A19D; --rule:#252A27; --shadow:0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --green:#52C08C; --green-soft:#16211B; --dark:#070908; --page:#0B0D0C; --card:#141816;
  --text:#ECF1EE; --muted:#98A19D; --rule:#252A27; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--page);color:var(--text);
  font-family:Cairo,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.6}
img{display:block;max-width:100%}
.wrap{max-width:74rem;margin:0 auto;padding:0 1.1rem}

.hero{position:relative;overflow:hidden;background:
    radial-gradient(130% 85% at 50% 0%, #143A28 0%, transparent 62%), var(--dark);
  color:#fff;padding:.5rem 0 2.25rem}
.hero-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .9s ease}
.hero-vid.on{opacity:1}
.hero-veil{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(5,11,8,.8) 0%,rgba(5,11,8,.64) 45%,rgba(5,11,8,.93) 100%)}
.hero>.wrap{position:relative;z-index:1}
@media(min-width:48rem){.hero{padding:1rem 0 3.25rem}}
.nav{display:flex;align-items:center;justify-content:flex-end;gap:1rem;padding:.6rem 1.1rem}
.switch{display:flex;gap:.2rem;background:rgba(255,255,255,.1);border-radius:999px;padding:.2rem}
.switch button{font:inherit;font-size:.8125rem;font-weight:600;border:0;background:transparent;
  color:rgba(255,255,255,.7);padding:.28rem .8rem;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--green);color:#fff}
.switch button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero-body{text-align:center;padding-top:.5rem}
@media(min-width:48rem){.hero-body{padding-top:1rem}}
.hero-body h1{margin:0;display:flex;justify-content:center}
.logo{width:clamp(8.5rem,34vw,11.5rem);height:auto;color:#fff}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hero-body p{margin:1.1rem 0 0;color:rgba(255,255,255,.72);font-weight:300;font-size:.95rem}
.hero-body .place{display:inline-block;margin-top:1.25rem;background:var(--green);color:#fff;
  text-decoration:none;font-size:.875rem;font-weight:600;padding:.5rem 1.2rem;border-radius:999px}
.hero-body .place:focus-visible{outline:2px solid #fff;outline-offset:2px}

.bar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--rule);
  box-shadow:var(--shadow)}
.bar .wrap{display:flex;align-items:center;gap:.9rem;padding-top:.7rem;padding-bottom:.7rem}
.cats{padding:1.4rem 1.1rem .5rem}
.cats-grid{display:grid;gap:.9rem .35rem;grid-template-columns:repeat(auto-fit,minmax(4.1rem,1fr))}
@media(min-width:48rem){.cats-grid{grid-template-columns:repeat(13,1fr);gap:1rem .5rem}}
.cat-btn{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:.45rem;min-width:0}
.cat-btn .disc{width:3.1rem;height:3.1rem;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--rule);color:var(--text)}
.cat-btn .disc .ic{width:1.6rem;height:1.6rem;stroke-width:1.7}
.cat-btn .lbl{font-size:.7rem;line-height:1.25;text-align:center;max-width:100%;
  overflow-wrap:anywhere;hyphens:auto}
.cat-btn[aria-pressed="true"] .disc{background:var(--green);border-color:var(--green);color:#fff}
.cat-btn[aria-pressed="true"] .lbl{color:var(--green);font-weight:700}
.cat-btn:focus-visible .disc{outline:2px solid var(--green);outline-offset:3px}
.search{flex:1 1 auto}
.search input{width:100%;font:inherit;font-size:.875rem;padding:.45rem .8rem;
  border:1px solid var(--rule);border-radius:.6rem;background:var(--page);color:var(--text)}
.search input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}

main{padding:2rem 0 3rem}
.group{margin-bottom:2.5rem;scroll-margin-top:4.5rem}
.group h2{font-family:Amiri,serif;font-size:1.65rem;margin:0 0 1.1rem;
  display:flex;align-items:center;gap:.55rem}
.group h2 em{font-style:normal;font-family:Cairo,sans-serif;font-size:.8125rem;
  font-weight:400;color:var(--muted)}
.grid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,10.5rem),1fr))}
@media(min-width:48rem){.grid{grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:1.4rem}}
.card{background:var(--card);border-radius:.9rem;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;border:1px solid var(--rule);padding:0;font:inherit;
  color:inherit;text-align:inherit;cursor:zoom-in}
.card:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.shot{position:relative;aspect-ratio:4/3;background:var(--green-soft);overflow:hidden;display:block}
.shot img{width:100%;height:100%;object-fit:cover}
.body{padding:.75rem .85rem .9rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.body h3{margin:0;font-size:.95rem;font-weight:600;line-height:1.35}
.body .cat{font-size:.75rem;color:var(--muted);display:block}
.body .price{margin-top:auto;padding-top:.35rem;color:var(--green);font-weight:700;
  font-size:1.05rem;font-variant-numeric:tabular-nums;display:block}
.body .price.na{color:var(--muted);font-size:.875rem;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:4rem 0}
.ic{flex:0 0 auto;width:1.2em;height:1.2em;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.group h2 .ic{width:1.4rem;height:1.4rem;stroke-width:1.7}

dialog.lb{border:0;padding:0;background:transparent;max-width:min(92vw,28rem);width:100%}
dialog.lb::backdrop{background:rgba(6,9,7,.85)}
.lb-inner{background:var(--card);border-radius:1rem;overflow:hidden}
.lb-wrap{position:relative}
.lb-inner img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--green-soft)}
.lb-meta{padding:1rem 1.1rem 1.25rem}
.lb-meta h3{margin:0 0 .15rem;font-size:1.15rem;font-weight:700}
.lb-meta .cat{font-size:.8125rem;color:var(--muted)}
.lb-meta .price{margin-top:.5rem;color:var(--green);font-weight:700;font-size:1.3rem}
.lb-close{position:absolute;inset-inline-end:.6rem;top:.6rem;width:2.25rem;height:2.25rem;
  border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:1.1rem;cursor:pointer}

footer{background:var(--dark);color:#fff;padding:3rem 0 1.5rem;margin-top:1rem;
  border-top:1px solid var(--rule)}
.cols{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
footer h4{font-size:1rem;font-weight:700;margin:0 0 .9rem}
footer ul{list-style:none;margin:0;padding:0}
footer li{padding:.22rem 0;font-size:.9rem;color:rgba(255,255,255,.7)}
footer a{color:rgba(255,255,255,.7);text-decoration:none}
footer a:hover{color:var(--green)}
.copy{border-top:1px solid rgba(255,255,255,.1);margin-top:2.25rem;padding-top:1.1rem;
  font-size:.8125rem;color:rgba(255,255,255,.45);text-align:center}
.up{position:fixed;inset-inline-end:1rem;bottom:1rem;z-index:40;border:0;cursor:pointer;
  width:2.75rem;height:2.75rem;border-radius:50%;background:var(--green);color:#fff;font-size:1.1rem;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.up.on{opacity:1;pointer-events:auto}
</style>
</head>

const T = {
  ar:{lang:"ar",dir:"rtl",title:"القائمة",tag:"كل لحظة أحلى",
      place:"مرسين، السولي",addr:"مرسين، السولي",
      all:"الكل",search:"ابحث",empty:"ما في نتائج مطابقة",na:"حسب الطلب",unit:"₺",
      f1:"للتواصل",f2:"الأقسام",f3:"تابعنا",copy:"لاروشيه كافيه — جميع الحقوق محفوظة",
      count:n=>n+" صنف",up:"أعلى الصفحة",close:"إغلاق"},
  tr:{lang:"tr",dir:"ltr",title:"Menü",tag:"Her an daha tatlı",
      place:"Mersin, Soli",addr:"Mersin, Soli",
      all:"Tümü",search:"Ara",empty:"Sonuç bulunamadı",na:"Sorunuz",unit:"₺",
      f1:"İletişim",f2:"Kategoriler",f3:"Takip et",copy:"La Roche Cafe — Tüm hakları saklıdır",
      count:n=>n+" ürün",up:"Yukarı",close:"Kapat"}
};

let lang="ar", cat="all", q="";
const $=s=>document.querySelector(s);
const menuEl=$("#menu"), chipsEl=$("#chips"), emptyEl=$("#empty"), qEl=$("#q");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chrome(){
  const t=T[lang];
  document.documentElement.lang=t.lang;
  document.documentElement.dir=t.dir;
  document.title=(lang==="ar"?"لاروشيه كافيه":"La Roche Cafe")+" — "+t.title;
  $("#title").textContent=(lang==="ar"?"لاروشيه كافيه":"La Roche Cafe")+" — "+t.title;
  $("#tagline").textContent=t.tag;
  $("#place").textContent=t.place;
  $("#f-addr").textContent=t.addr;
  $("#f1").textContent=t.f1; $("#f2").textContent=t.f2; $("#f3").textContent=t.f3;
  $("#f-copy").textContent=t.copy;
  $("#up").setAttribute("aria-label",t.up);
  $("#lb-close").setAttribute("aria-label",t.close);
  qEl.placeholder=t.search; qEl.setAttribute("aria-label",t.search);
  const disc=(k,label,on)=>'<button class="cat-btn" type="button" data-cat="'+k+'" aria-pressed="'+on+'">'+
    '<span class="disc"><svg class="ic" aria-hidden="true"><use href="#ic-'+(k==="all"?"all":k)+'"/></svg></span>'+
    '<span class="lbl">'+label+'</span></button>';
  chipsEl.innerHTML = disc("all",t.all,cat==="all")+
    MENU.map(c=>disc(c.id,esc(c[lang]),cat===c.id)).join("");
  $("#f-cats").innerHTML=MENU.map(c=>'<li><a href="#g-'+c.id+'" data-jump="'+c.id+'">'+esc(c[lang])+'</a></li>').join("");
}

function card(it,c,ci,ii){
  const t=T[lang], name=it[lang==="ar"?0:1];
  return '<button class="card" type="button" data-c="'+ci+'" data-i="'+ii+'">'+
    '<span class="shot"><img loading="lazy" decoding="async" src="'+url(it[3],it[4])+'"'+
      (it[4]&&it[5] ? ' srcset="'+url(it[3],it[4])+' '+wOf(it[4])+'w, '+url(it[3],it[5])+' '+wOf(it[5])+'w" sizes="(min-width:48rem) 230px, 45vw"' : '')+
      ' alt="'+esc(name)+'"></span>'+
    '<span class="body"><h3>'+esc(name)+'</h3>'+
      '<span class="cat">'+esc(c[lang])+'</span>'+
      '<span class="price'+(it[2]?"":" na")+'">'+(it[2]?it[2]+" "+t.unit:t.na)+'</span>'+
    '</span></button>';
}

function render(){
  const t=T[lang], needle=q.trim().toLowerCase();
  let html="", total=0;
  MENU.forEach((c,ci)=>{
    if(cat!=="all" && cat!==c.id) return;
    const hits=[];
    c.items.forEach((i,ii)=>{
      if(!needle || (i[0]+" "+i[1]).toLowerCase().includes(needle) ||
         (c.ar+" "+c.tr).toLowerCase().includes(needle)) hits.push([i,ii]);
    });
    if(!hits.length) return;
    total+=hits.length;
    html+='<section class="group" id="g-'+c.id+'">'+
      '<h2><svg class="ic" aria-hidden="true"><use href="#ic-'+c.icon+'"/></svg>'+esc(c[lang])+'<em>'+t.count(hits.length)+'</em></h2>'+
      '<div class="grid">'+hits.map(([i,ii])=>card(i,c,ci,ii)).join("")+'</div></section>';
  });
  menuEl.innerHTML=html;
  emptyEl.hidden=total>0;
  emptyEl.textContent=t.empty;
}

const lb=$("#lb");
menuEl.addEventListener("click",e=>{
  const b=e.target.closest(".card"); if(!b) return;
  const c=MENU[+b.dataset.c], it=c.items[+b.dataset.i], t=T[lang];
  $("#lb-img").src=url(it[3],it[5]||it[4]);
  $("#lb-img").alt=it[lang==="ar"?0:1];
  $("#lb-name").textContent=it[lang==="ar"?0:1];
  $("#lb-cat").textContent=c[lang];
  $("#lb-price").textContent=it[2]?it[2]+" "+t.unit:t.na;
  if(lb.showModal) lb.showModal();
});
$("#lb-close").addEventListener("click",()=>lb.close());
lb.addEventListener("click",e=>{ if(e.target===lb) lb.close(); });

chipsEl.addEventListener("click",e=>{
  const b=e.target.closest("button[data-cat]"); if(!b) return;
  cat=b.dataset.cat;
  chipsEl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.cat===cat)));
  render();
  window.scrollTo({top:document.querySelector(".bar").offsetTop});
});
qEl.addEventListener("input",()=>{q=qEl.value; render();});
$("#f-cats").addEventListener("click",e=>{
  if(e.target.closest("a[data-jump]") && cat!=="all"){cat="all"; chrome(); render();}
});
document.querySelectorAll(".switch button").forEach(b=>{
  b.addEventListener("click",()=>{
    lang=b.dataset.lang;
    document.querySelectorAll(".switch button").forEach(x=>
      x.setAttribute("aria-pressed",String(x.dataset.lang===lang)));
    chrome(); render();
    try{localStorage.setItem("laroche-lang",lang)}catch(e){}
  });
});
const upBtn=$("#up");
upBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
addEventListener("scroll",()=>upBtn.classList.toggle("on",scrollY>600),{passive:true});

try{
  const saved=localStorage.getItem("laroche-lang");
  if(saved==="tr"||saved==="ar"){
    lang=saved;
    document.querySelectorAll(".switch button").forEach(x=>
      x.setAttribute("aria-pressed",String(x.dataset.lang===lang)));
  }
}catch(e){}

chrome(); render();

// Hero video: skipped entirely on reduced-motion or data-saver; paused when off screen.
(function(){
  const v=document.querySelector(".hero-vid"); if(!v) return;
  const slow = (navigator.connection||{}).saveData === true;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(slow||still){ v.remove(); return; }
  v.addEventListener("loadeddata",()=>v.classList.add("on"),{once:true});
  v.addEventListener("error",()=>v.remove(),{once:true});
  v.src=v.dataset.src;
  const go=()=>v.play().catch(()=>{});
  v.addEventListener("canplay",go,{once:true}); go();
  if("IntersectionObserver" in window){
    new IntersectionObserver(es=>es.forEach(e=>{ e.isIntersecting?go():v.pause(); })).observe(v);
  }
})();
</script>
</body>
